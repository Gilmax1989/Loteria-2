name: Leer resultados
on:
  schedule:
    - cron: "*/20 13-23,0-3 * * *"   # cada 20 min, de ~9 AM a ~11 PM hora de RD
  workflow_dispatch: {}              # botón para correrlo a mano
permissions:
  contents: write
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python leer.py
      - name: Guardar si cambió
        run: |
          git config user.name "lector"
          git config user.email "lector@users.noreply.github.com"
          git add resultados.txt
          git diff --staged --quiet || (git commit -m "Resultados actualizados" && git push)
